# Home Assistant app (add-on) manifest for RuView.
# Reference: https://developers.home-assistant.io/docs/apps/configuration
name: RuView
version: "0.1.0"
slug: ruview
description: >-
  Camera-free presence sensing from ESP32 Wi-Fi signals (CSI), published to
  Home Assistant over MQTT
url: https://github.com/Justinwold88/ruview-ha-addon
arch:
  - aarch64
  - amd64
# Prebuilt multi-arch image; `version` above is its tag. Home Assistant never
# builds this app locally: building RuView from source takes far too long on
# a Home Assistant host.
image: ghcr.io/justinwold88/ruview-addon
stage: experimental
startup: application
boot: auto
# Reads the MQTT broker (for example the Mosquitto app) from the Supervisor
# when one is installed. Works without one if you set a broker below or
# turn MQTT off.
services:
  - mqtt:want
ports:
  3000/tcp: 3000
  3001/tcp: 3001
  5005/udp: 5005
webui: "http://[HOST]:[PORT:3000]/ui/index.html"
options:
  csi_source: esp32
  udp_allow: []
  udp_insecure_lan: false
  mqtt: true
  trusted_network: false
  privacy_mode: false
  publish_heart_rate: false
  publish_fall: false
  log_level: info
schema:
  csi_source: list(esp32|simulated)
  # Each entry is one IPv4/IPv6 address or CIDR block, for example
  # 192.168.1.0/24. RuView validates them again at startup.
  udp_allow:
    - "match(^[0-9A-Fa-f:.]{2,45}(/[0-9]{1,3})?$)"
  udp_insecure_lan: bool
  mqtt: bool
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  api_token: "password?"
  trusted_network: bool
  privacy_mode: bool
  publish_heart_rate: bool
  publish_fall: bool
  log_level: list(trace|debug|info|warn|error)
